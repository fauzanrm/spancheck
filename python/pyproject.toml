[project]
name = "spancheck"
version = "0.1.0"
description = "Verify that an LLM citation supports its claim, and locate it in the PDF."
license = "MIT"
readme = "README.md"
authors = [
    { name = "Fauzan Maulana", email = "reza.maulana@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
